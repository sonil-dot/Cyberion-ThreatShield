title: PowerShell Encoded Command Execution
id: 3d7a2e91-6c45-4f81-9b32-5a7c8d9e1024
status: experimental
description: Detects PowerShell process creation where the command line contains common encoded-command flags.
author: Cyberion ThreatShield
date: 2026/10/23
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_encoded:
        CommandLine|contains:
            - '-encodedcommand'
            - '-encodedcommand '
            - '-enc '
            - '-e '
    condition: selection_image and selection_encoded
falsepositives:
    - Authorized administrative scripts that use encoded PowerShell commands.
level: medium