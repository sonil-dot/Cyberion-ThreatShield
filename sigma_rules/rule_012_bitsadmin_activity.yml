
title: Possible BITS Job Abuse
id: 3b8f1d62-5a94-4c70-9e21-7d6a2f805c43
status: experimental
description: Detects bitsadmin.exe commands using job creation or file-addition options, which may indicate BITS transfer activity requiring investigation.
date: 2026/10/23
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\bitsadmin.exe'
    selection_command:
        CommandLine|contains:
            - '/create'
            - '/addfile'
    condition: selection_image and selection_command
falsepositives:
    - Legitimate background downloads or administrative software deployment.
level: medium
