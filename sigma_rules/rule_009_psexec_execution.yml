
title: Possible PsExec Remote Execution
id: 8f2c6d41-3a75-4b90-a1e6-5c7d9f204b83
status: experimental
description: Detects PsExec executable names in process creation telemetry as a possible indicator of remote administration or lateral movement; this rule does not detect all PsExec-related activity.
author: Cyberion ThreatShield
date: 2026/10/23
tags:
    - attack.t1569.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '\PsExec.exe'
            - '\PsExec64.exe'
    condition: selection_image
falsepositives:
    - Authorized IT administration using PsExec.
level: medium
