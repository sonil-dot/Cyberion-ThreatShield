
title: Possible SSH Private Key Discovery
id: 7d1f3a82-6c95-4b40-8e27-9a5d2c604f13
status: experimental
description: Detects command-line activity referencing common SSH private key paths.
author: Cyberion ThreatShield
date: 2026/10/23
logsource:
    product: windows
    category: process_creation
detection:
    selection_command:
        CommandLine|contains:
            - '\.ssh\id_rsa'
            - '\.ssh\id_ed25519'
            - '\.ssh\id_ecdsa'
    condition: selection_command
falsepositives:
    - Legitimate SSH administration, key backup, or developer activity.
level: medium
