title: Rundll32 Executing DLL from User Writable Directory
id: 6a9f1c42-8d73-4e05-a2b6-7c1d9f305e84
status: experimental
description: Detects rundll32.exe process creation where the command line references common user-writable directories.
author: Cyberion ThreatShield
date: 2026/10/23
tags:
    - attack.stealth
    - attack.t1218.011
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\rundll32.exe'
    selection_path:
        CommandLine|contains:
            - '\AppData\'
            - '\Temp\'
            - '\Windows\Temp\'
            - '\Users\Public\'
    condition: selection_image and selection_path
falsepositives:
    - Legitimate applications loading DLLs from user-writable directories.
level: medium