
title: Regsvr32 Scriptlet Execution
id: 8a4d2f71-6c93-4b50-9e18-3d7f5a206c84
status: experimental
description: Detects regsvr32.exe command lines containing scriptlet-related options that may indicate suspicious proxy execution.
author: Cyberion ThreatShield
date: 2026/10/23
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\regsvr32.exe'
    selection_command:
        CommandLine|contains:
            - '/i:'
            - 'scrobj.dll'
    condition: selection_image and selection_command
falsepositives:
    - Legitimate DLL registration or approved application installation.
level: medium
