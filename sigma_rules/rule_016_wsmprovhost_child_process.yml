
title: Suspicious Command Interpreter Launched by WinRM Host
name: rule_016_wsmprovhost_child_process
id: 7b2d4e6a-8c10-4f31-9a52-6d8e0b1c3f75
status: experimental
description: Detects command interpreters launched by the Windows Remote Management host process for investigation.
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\wsmprovhost.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate remote administration and automation
level: medium
