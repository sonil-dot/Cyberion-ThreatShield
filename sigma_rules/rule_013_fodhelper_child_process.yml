
title: Fodhelper Launching Command Interpreter
id: 6c2e9a41-7f35-4b80-a1d6-5e3c8f902b74
status: experimental
description: Detects cmd.exe or PowerShell launched by fodhelper.exe, a parent-child relationship that may indicate UAC bypass activity and requires contextual investigation.
author: Cyberion ThreatShield
date: 2026/10/23
references:
    - https://attack.mitre.org/techniques/T1548/002/
tags:
    - attack.privilege-escalation
    - attack.t1548.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith: '\fodhelper.exe'
    selection_child:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Authorized system administration or software troubleshooting.
level: high
