
title: Possible Local User Account Creation
id: 4a7d2c91-8f63-45b0-9e21-6c5a3f807d42
status: experimental
description: Detects net.exe or net1.exe commands containing user creation arguments that may indicate local account creation.
date: 2026/10/23
tags:
    - attack.t1136.001
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
    selection_command:
        CommandLine|contains|all:
            - 'user'
            - '/add'
    condition: all of selection_*
falsepositives:
    - Authorized user account provisioning by administrators or IT support.
level: medium
