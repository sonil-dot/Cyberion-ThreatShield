title: Windows Service Creation
id: 2f8a4c71-9d36-4b50-a7e2-6c1d5f903b84
status: experimental
description: Detects sc.exe commands that create a Windows service.
author: Cyberion ThreatShield
date: 2026/10/23
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\sc.exe'
    selection_create:
        CommandLine|contains: 'create'
    condition: selection_image and selection_create
falsepositives:
    - Legitimate software installation or service administration.
level: medium